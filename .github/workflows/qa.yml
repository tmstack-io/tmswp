name: QA

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ramsey/composer-install@v3
      - name: Forbid PHPStan baseline
        run: |
          if ls phpstan-baseline* 2>/dev/null; then
            echo '::error::PHPStan baseline files are forbidden (DR-12)'
            exit 1
          fi
      - run: composer lint

  analyse:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ramsey/composer-install@v3
      - run: composer analyse

  monorepo:
    name: Monorepo Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ramsey/composer-install@v3
      - run: composer monorepo:validate

  rules-verify:
    name: Rules Code Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ramsey/composer-install@v3
      - name: Extract rules code examples
        run: php tools/extract-rules-code.php
      - name: Verify extracted examples
        run: php tools/verify-rules-code.php

  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.3' && 'pcov' || 'none' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ramsey/composer-install@v3
      - name: Run unit tests
        if: matrix.php != '8.3'
        run: composer test:unit
      - name: Run unit tests with coverage gate
        if: matrix.php == '8.3'
        run: composer test:coverage
      - name: Upload coverage artifact
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: var/coverage/clover.xml

  integration:
    name: Integration (PHP ${{ matrix.php }} / WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        wp: ['6.4', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ramsey/composer-install@v3
      - name: Pin wp-phpunit to WP 6.4
        if: matrix.wp != 'latest'
        run: composer bin wp-tests require --no-interaction "wp-phpunit/wp-phpunit:~6.4.0" --update-with-all-dependencies
      - name: Create wp-env override
        run: |
          if [ "${{ matrix.wp }}" = "latest" ]; then
            CORE=null
          else
            CORE='"https://wordpress.org/wordpress-${{ matrix.wp }}.zip"'
          fi
          printf '{"core": %s, "phpVersion": "%s"}\n' "$CORE" "${{ matrix.php }}" > .wp-env.override.json
      - name: Start wp-env
        run: |
          for attempt in 1 2 3; do
            if npx wp-env start; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
      - name: Run integration tests
        run: composer test:integration
      - name: Show wp-env logs on failure
        if: failure()
        run: npx wp-env logs tests || true
